<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="chat-container">

        <h1>AI Assistant (OpenRouter - ChatGPT o4)</h1>

        <div id="chat"></div>

        <form id="chat-form">

            <input
                id="message"
                type="text"
                placeholder="Ask anything..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Send
            </button>

        </form>

    </main>

    <script src="app.js"></script>

</body>

</html>
